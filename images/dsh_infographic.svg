<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1750" viewBox="0 0 980 1750" font-family="HONOR Sans Design, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#121a36"/><stop offset="100%" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="cardbad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c1428"/><stop offset="100%" stop-color="#150f1e"/></linearGradient>
    <linearGradient id="cardgood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10232a"/><stop offset="100%" stop-color="#0c1a1f"/></linearGradient>
  </defs>
  <rect width="980" height="1750" fill="url(#bg)"/>
  <rect x="24" y="24" width="932" height="1702" rx="22" fill="none" stroke="#2a3b68" stroke-width="2"/>
  <rect x="54" y="58" width="360" height="46" rx="23" fill="#12304a" stroke="#1e4a6e" stroke-width="1.5"/>
  <text x="234" y="88" text-anchor="middle" font-size="23" fill="#7dd3fc" letter-spacing="2">DeepSeek Harness · Android 部署实战</text>
  <text x="54" y="170" font-size="56" font-weight="800" fill="#e8eefc" letter-spacing="1">DSH 跑在手机上的</text>
  <text x="54" y="232" font-size="56" font-weight="800" fill="#38bdf8" letter-spacing="1">5 个核心踩坑 与解法</text>
  <text x="54" y="282" font-size="24" fill="#8aa0c8" letter-spacing="1">Termux + proot 环境 · 一文速查 · 附命令</text>
  <line x1="54" y1="316" x2="926" y2="316" stroke="#26365f" stroke-width="1.5"/>
  <rect x="54" y="344" width="420" height="480" rx="16" fill="url(#cardbad)" stroke="#5a2a3a" stroke-width="2"/>
  <text x="82" y="392" font-size="28" font-weight="700" fill="#fda4af">⚠️ 踩过的坑</text>
  <circle cx="84" cy="418" r="5" fill="#b4546a"/><text x="102" y="426" font-size="22" fill="#c6d4ee">dsh --help 会阻塞，直接 exec 进</text><text x="102" y="454" font-size="22" fill="#c6d4ee">headless CLI，不是帮助信息</text>
  <circle cx="84" cy="478" r="5" fill="#b4546a"/><text x="102" y="486" font-size="22" fill="#c6d4ee">headless 不支持连续对话，</text><text x="102" y="514" font-size="22" fill="#c6d4ee">每轮都重新发起会话</text>
  <circle cx="84" cy="538" r="5" fill="#b4546a"/><text x="102" y="546" font-size="22" fill="#c6d4ee">--resume 参数位置敏感，</text><text x="102" y="574" font-size="22" fill="#c6d4ee">必须紧跟子命令、放 profile 前面</text>
  <circle cx="84" cy="598" r="5" fill="#b4546a"/><text x="102" y="606" font-size="22" fill="#c6d4ee">AI 文生图配图中文字必乱码，</text><text x="102" y="634" font-size="22" fill="#c6d4ee">不能当教程图用</text>
  <circle cx="84" cy="658" r="5" fill="#b4546a"/><text x="102" y="666" font-size="22" fill="#c6d4ee">没有 plugin 子命令，</text><text x="102" y="694" font-size="22" fill="#c6d4ee">别按插件那套调用</text>
  <rect x="506" y="344" width="420" height="480" rx="16" fill="url(#cardgood)" stroke="#1f4a52" stroke-width="2"/>
  <text x="534" y="392" font-size="28" font-weight="700" fill="#5eead4">✅ 正确姿势</text>
  <circle cx="536" cy="418" r="5" fill="#299c94"/><text x="554" y="426" font-size="22" fill="#c6d4ee">把 /usr/local/bin/dsh 当</text><text x="554" y="454" font-size="22" fill="#c6d4ee">单条问答包装脚本 用</text>
  <circle cx="536" cy="478" r="5" fill="#299c94"/><text x="554" y="486" font-size="22" fill="#c6d4ee">命令顺序：dsh --resume</text><text x="554" y="514" font-size="22" fill="#c6d4ee">[profile] [提问]，profile 紧跟 resume</text>
  <circle cx="536" cy="538" r="5" fill="#299c94"/><text x="554" y="546" font-size="22" fill="#c6d4ee">想要多轮对话，就自己循环调用，</text><text x="554" y="574" font-size="22" fill="#c6d4ee">不要依赖内置 session</text>
  <circle cx="536" cy="598" r="5" fill="#299c94"/><text x="554" y="606" font-size="22" fill="#c6d4ee">配图改用 HTML/CSS 手绘 + 截图，</text><text x="554" y="634" font-size="22" fill="#c6d4ee">文字 100% 准确</text>
  <circle cx="536" cy="658" r="5" fill="#299c94"/><text x="554" y="666" font-size="22" fill="#c6d4ee">凭据由 DSH 原生 Web UI 管理，</text><text x="554" y="694" font-size="22" fill="#c6d4ee">脚本层不碰密钥</text>
  <line x1="54" y1="860" x2="926" y2="860" stroke="#26365f" stroke-width="1.5"/>
  <rect x="54" y="888" width="420" height="230" rx="16" fill="#111a34" stroke="#253666" stroke-width="2"/>
  <text x="82" y="936" font-size="28" font-weight="700" fill="#7dd3fc">🔧 环境清单</text>
  <circle cx="84" cy="962" r="5" fill="#33477e"/><text x="102" y="970" font-size="22" fill="#c6d4ee">Node.js / npm 已就绪</text>
  <circle cx="84" cy="998" r="5" fill="#33477e"/><text x="102" y="1006" font-size="20" fill="#7dd3fc" font-family="monospace">exec node apps/cli/lib/bin.js</text><text x="102" y="1034" font-size="20" fill="#7dd3fc" font-family="monospace">--profile headless</text>
  <circle cx="84" cy="1060" r="5" fill="#33477e"/><text x="102" y="1068" font-size="22" fill="#c6d4ee">Android 15 · Termux · proot</text>
  <rect x="506" y="888" width="420" height="230" rx="16" fill="#111a34" stroke="#253666" stroke-width="2"/>
  <text x="534" y="936" font-size="28" font-weight="700" fill="#7dd3fc">📌 一句话结论</text>
  <circle cx="536" cy="962" r="5" fill="#33477e"/><text x="554" y="970" font-size="22" fill="#c6d4ee">DSH headless = 轻量单发问答器，</text><text x="554" y="998" font-size="22" fill="#c6d4ee">不是对话机器人</text>
  <circle cx="536" cy="1022" r="5" fill="#33477e"/><text x="554" y="1030" font-size="22" fill="#c6d4ee">配图别用 AI 文生图，</text><text x="554" y="1058" font-size="22" fill="#c6d4ee">代码排版才是中文正解</text>
  <text x="490" y="1195" text-anchor="middle" font-size="20" fill="#6177a5" letter-spacing="1">DeepSeek Harness · Android 踩坑实录 | 知乎 / 掘金 / CSDN 同步发布</text>
</svg>