<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','SimHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#273449"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <text x="600" y="90" text-anchor="middle" font-size="52" font-weight="bold" fill="#f1f5f9">Android / Termux 部署 DeepSeek Harness</text>
  <text x="600" y="145" text-anchor="middle" font-size="34" fill="#94a3b8">4 个必踩的坑 · 根因与修复</text>
  <rect x="450" y="175" width="300" height="6" rx="3" fill="url(#accent)"/>
  <rect x="80" y="220" width="1040" height="290" rx="18" fill="url(#card)" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="290" r="38" fill="url(#accent)"/>
  <text x="150" y="302" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">1</text>
  <text x="230" y="275" font-size="36" font-weight="bold" fill="#f1f5f9">FUSE 禁止硬链接 → session 落盘失败</text>
  <text x="230" y="330" font-size="26" fill="#fca5a5">现象：proot 目录里「保存会话」报错，session 永远写不进去</text>
  <text x="230" y="380" font-size="26" fill="#cbd5e1">根因：/sdcard 走 FUSE 文件系统，不支持系统调用 link()</text>
  <rect x="230" y="410" width="430" height="70" rx="10" fill="#0f172a"/>
  <text x="445" y="440" text-anchor="middle" font-size="24" fill="#fca5a5" font-family="DejaVu Sans Mono,monospace">link(tmp, final)   ✗ FUSE 失败</text>
  <text x="445" y="468" text-anchor="middle" font-size="24" fill="#86efac" font-family="DejaVu Sans Mono,monospace">rename(tmp, final) ✓ FUSE 正常</text>
  <rect x="80" y="540" width="1040" height="280" rx="18" fill="url(#card)" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="610" r="38" fill="url(#accent)"/>
  <text x="150" y="622" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">2</text>
  <text x="230" y="595" font-size="36" font-weight="bold" fill="#f1f5f9">dsh web 启动假死，DSH_HOME 未设</text>
  <text x="230" y="650" font-size="26" fill="#fca5a5">现象：进程「起来了」但界面死等，端口看似没监听，curl 却是通的</text>
  <text x="230" y="700" font-size="26" fill="#cbd5e1">根因：web 模式读写 DSH_HOME 指向目录，未设置时在错误路径兜圈</text>
  <rect x="230" y="725" width="650" height="62" rx="10" fill="#0f172a"/>
  <text x="555" y="762" text-anchor="middle" font-size="24" fill="#86efac" font-family="DejaVu Sans Mono,monospace">export DSH_HOME=~/.dsh</text>
  <rect x="80" y="850" width="1040" height="280" rx="18" fill="url(#card)" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="920" r="38" fill="url(#accent)"/>
  <text x="150" y="932" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">3</text>
  <text x="230" y="905" font-size="36" font-weight="bold" fill="#f1f5f9">三个 CLI 行为坑</text>
  <text x="230" y="958" font-size="26" fill="#cbd5e1">· --help 会阻塞不返回 → 直接 Ctrl+C / 翻 README</text>
  <text x="230" y="1008" font-size="26" fill="#cbd5e1">· headless 不支持连续对话 → 用外部包装脚本维持上下文</text>
  <text x="230" y="1058" font-size="26" fill="#cbd5e1">· --resume 位置敏感 → 靠后、紧跟子命令</text>
  <rect x="230" y="1075" width="650" height="40" rx="10" fill="#0f172a"/>
  <text x="555" y="1102" text-anchor="middle" font-size="22" fill="#86efac" font-family="DejaVu Sans Mono,monospace">dsh &lt;subcommand&gt; --resume &lt;id&gt;</text>
  <rect x="80" y="1160" width="1040" height="260" rx="18" fill="url(#card)" stroke="#334155" stroke-width="2"/>
  <circle cx="150" cy="1230" r="38" fill="url(#accent)"/>
  <text x="150" y="1242" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">4</text>
  <text x="230" y="1215" font-size="36" font-weight="bold" fill="#f1f5f9">web 模式在手机基本无解 → 走 CLI</text>
  <text x="230" y="1270" font-size="26" fill="#fca5a5">现象：web 依赖的 sharp 图像库性能极差，页面频繁卡死</text>
  <text x="230" y="1320" font-size="26" fill="#86efac">结论：放弃 web，走 CLI —— 轻量、无需图像处理、可配合语音输入</text>
  <rect x="230" y="1340" width="240" height="48" rx="24" fill="#16a34a"/>
  <text x="350" y="1372" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">推荐：CLI</text>
  <text x="600" y="1520" text-anchor="middle" font-size="24" fill="#64748b">github.com/a13418414529/dsh-android-guide</text>
</svg>